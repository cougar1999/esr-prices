<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت لینک‌ها | ESR</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Vazirmatn, Tahoma, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: white;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; text-align: center; }
    .subtitle { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 28px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    input:focus, select:focus { outline: none; border-color: #2563eb; }
    button {
      width: 100%;
      padding: 13px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #1e40af; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .result {
      margin-top: 24px;
      padding: 16px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 12px;
      display: none;
    }
    .result.active { display: block; }
    .result label { color: #166534; }
    .result input {
      background: white;
      direction: ltr;
      text-align: left;
      font-size: 0.85rem;
    }
    .copy-btn {
      background: #16a34a;
      margin-top: 10px;
    }
    .copy-btn:hover { background: #15803d; }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
      font-size: 0.9rem;
    }
    .error.active { display: block; }
    .login-box { text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="box login-box" id="login-box">
    <h1>ورود به پنل مدیریت</h1>
    <p class="subtitle">رمز عبور پنل را وارد کنید</p>
    <div class="error" id="login-error">رمز عبور اشتباه است</div>
    <input type="password" id="admin-password" placeholder="رمز عبور" style="text-align: center;">
    <button onclick="login()">ورود</button>
  </div>

  <!-- Admin Panel -->
  <div class="box hidden" id="admin-box">
    <h1>ساخت لینک یک‌بارمصرف</h1>
    <p class="subtitle">لینک جدید برای مشتری بسازید</p>

    <div class="error" id="gen-error"></div>

    <label>نام مشتری (اختیاری)</label>
    <input type="text" id="customer-note" placeholder="مثلاً: آقای رضایی - پایان‌نامه">

    <label>مدت اعتبار لینک</label>
    <select id="expiry">
      <option value="24">۲۴ ساعت</option>
      <option value="48">۴۸ ساعت</option>
      <option value="72">۳ روز</option>
      <option value="168">۷ روز</option>
      <option value="0">بدون انقضا (فقط یک‌بار مصرف)</option>
    </select>

    <button id="gen-btn" onclick="generateToken()">ساخت لینک جدید</button>

    <div class="result" id="result">
      <label>لینک آماده ارسال به مشتری:</label>
      <input type="text" id="final-link" readonly>
      <button class="copy-btn" onclick="copyLink()">کپی لینک</button>
    </div>
  </div>

  <script>
    // ==================== CONFIG ====================
    const SUPABASE_URL = 'https://ukkekoyyqsvfnibakivv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVra2Vrb3l5cXN2Zm5pYmFraXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Njk0NjYsImV4cCI6MjEwMjU0NTQ2Nn0.a5JOUGXSpYaPmbs_yWjVzuqFqIK0gKMkfToc_5wzxPs';
    const ADMIN_PASSWORD = 'esr2026';   // این رمز را عوض کنید
    // ================================================

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Your site base URL (after publishing on GitHub Pages change this)
    const SITE_BASE = window.location.origin;

    function login() {
      const pass = document.getElementById('admin-password').value;
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('admin-box').classList.remove('hidden');
      } else {
        document.getElementById('login-error').classList.add('active');
      }
    }

    function generateRandomToken() {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let token = '';
      for (let i = 0; i < 12; i++) {
        token += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return token;
    }

    async function generateToken() {
      const btn = document.getElementById('gen-btn');
      const errorEl = document.getElementById('gen-error');
      errorEl.classList.remove('active');
      btn.disabled = true;
      btn.textContent = 'در حال ساخت...';

      try {
        const token = generateRandomToken();
        const note = document.getElementById('customer-note').value.trim() || null;
        const hours = parseInt(document.getElementById('expiry').value);
        let expires_at = null;
        if (hours > 0) {
          const d = new Date();
          d.setHours(d.getHours() + hours);
          expires_at = d.toISOString();
        }

        const { error } = await supabaseClient
          .from('access_tokens')
          .insert({
            token: token,
            note: note,
            is_used: false,
            expires_at: expires_at
          });

        if (error) throw error;

        const fullLink = SITE_BASE + '/esr-prices/?token=' + token;
        document.getElementById('final-link').value = fullLink;
        document.getElementById('result').classList.add('active');
      } catch (err) {
        console.error(err);
        errorEl.textContent = 'خطا در ساخت لینک. مطمئن شوید Supabase را درست تنظیم کرده‌اید.';
        errorEl.classList.add('active');
      }

      btn.disabled = false;
      btn.textContent = 'ساخت لینک جدید';
    }

    function copyLink() {
      const input = document.getElementById('final-link');
      input.select();
      document.execCommand('copy');
      alert('لینک کپی شد!');
    }

    // Enter key for login
    document.getElementById('admin-password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
